<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Ready — Fit &amp; Eat</title>
<style>
  :root{--ink:#16241c;--muted:#5b6b61;--bg:#f7f4ec;--green:#1f5e3b;--lime:#c9e86b;--line:#e3ddcd}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;line-height:1.55}
  a{text-decoration:none}
  .card{max-width:520px;width:100%;background:#fff;border:1px solid var(--line);border-radius:28px;padding:48px 36px;text-align:center}
  .check{width:72px;height:72px;border-radius:50%;background:var(--lime);color:var(--green);display:grid;place-items:center;font-size:34px;font-weight:800;margin:0 auto 22px}
  h1{font-size:34px;letter-spacing:-.02em;line-height:1.1;margin-bottom:12px}
  p{color:var(--muted);margin-bottom:28px}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-block;padding:14px 24px;border-radius:999px;font-weight:600;font-size:15px;color:var(--ink);border:1.5px solid var(--ink)}
  .btn-primary{background:var(--green);color:#fff;border-color:var(--green)}
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Your plan is on its way!</h1>
    <p>Thanks for signing up. We're pairing your workouts with recipes now. Check your inbox for your first week and grocery list.</p>
    <div class="row">
      <a class="btn btn-primary" href="index.html#recipes">Browse recipes</a>
      <a class="btn" href="index.html">Back to home</a>
    </div>
  </div>
</body>
</html>
